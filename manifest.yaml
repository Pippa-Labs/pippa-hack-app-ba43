# ─────────────────────────────────────────────────────────────────────────────
# DIVERT — manifest for the Pippa Labs hackathon, Friday 20 November 2026.
#
# THIS FILE IS THE SUBMISSION. A reviewer reads the manifest and does not read
# the code, so every sentence does two jobs: it is the prose a human judges,
# and it is the behaviour deciding whether Pippa ever picks the app.
# Read it aloud before submitting.
#
# TWO THINGS TO FILL IN ON THE DAY — both marked XXX:
#   1. app_author_name  your PUBLIC pseudonym, never your real name
#   2. app.id           must match the repository name exactly or the build refuses
#
# There is no owner address and no publisher field here, and adding either
# back is a mistake. Pippa Labs removed both on 16 November (commit 64749fa):
# ownership comes from the repository they create for your account, and "no
# personal data belongs here". Their .githooks/pre-commit REFUSES any commit
# whose changed files contain an email address, so writing one into this file
# would block the push rather than fail quietly.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Enforced, not a preference. A fresh copy of the app is built per call and
# thrown away. DIVERT needs no memory: it answers from its inputs, a bundled
# lookup file and the live network.
persistence: none

# XXX PUBLIC pseudonym. It is the name everybody sees: "by <name>" on the
# install screen, in the app list and on every answer, so it is also what the
# badge is parsed from now that there is no separate publisher field. 3–30
# characters, letters, numbers, spaces, dots, hyphens and underscores, starting
# with a letter or a number. Never your real name and never an email — this
# repository is public, and their pre-commit hook also requires the name on
# each commit to match this value. Never "pippa", "official" or "verified".
app_author_name: "SecondFare"

app:
  # XXX `hack.` + the repository name with `pippa-hack-` removed and every
  # hyphen turned into an underscore. Hyphens are never valid in an app id.
  #   Pippa-Labs/pippa-hack-divert  ->  hack.divert
  # `git remote get-url origin` gives the repository name.
  id: hack.app_ba43
  name: Divert
  version: 0.1.0
  # The FIRST CLAUSE is what the routing model reads at gate 1, so it leads
  # with what the app works out. Must never contain the word "by": the badge
  # is parsed from "[via <name> <version> by <publisher>]" and splits on the
  # first "by", which would corrupt the attribution long after a green build.
  summary: >-
    Works out every way to get between two London stations right now, each
    with its real fare in pence and whether its line is disrupted, and warns
    when leaving one station and entering another would be charged as two
    journeys instead of one. Transport for London designates certain station
    pairs as a single journey and charges every other pair twice; that list is
    no longer published on their website, and no journey planner shows it.
    Does all ranking and fare arithmetic in code, calls no language model of
    its own, and answers from public open data in a single turn.

# ── The app's own API keys ───────────────────────────────────────────────────
#
# Not `secrets:`, which asks for a real user's credential and is refused at
# registration. These are the app's own keys: declared here by name only, read
# with os.environ, and given a value in Pippa under Apps > Created by me >
# your app > Keys. Nothing is ever committed, and changing one needs no push.
app_secrets:
- name: TFL_APP_KEY
  description: Optional Transport for London API key. Unkeyed is about 50 requests
    a minute per source address, not per app, so a shared network is throttled.
    A key raises it to about 500. Works without one.
  required: false

agent_types:
  - personal

outcomes:
  - id: journey.cost
    summary: >-
      List the ways to get between two named London stations now, each with
      its journey time, real fare and whether its line is disrupted, name the
      cheapest, and flag any interchange that would be charged twice.
    # Written the way a person types: lower case, no question mark, carrying
    # the subject. None of these uses a bare time word — "today", "tomorrow",
    # "this week" and "last week" belong to Pippa Diary and a phrase using
    # them loses the routing contest.
    # Written how a person types. The last three were added after testing
    # rephrasings that a literal reading of the first three would have missed:
    # "I need to get to Victoria" and "how long does it take to reach Liverpool
    # Street" matched nothing, because none of "need", "take" or "reach"
    # appeared anywhere. "how long" alone would be too generic to carry a
    # question, so it carries its subject.
    example_phrases:
      - how do i get from
      - whats the cheapest way to get to
      - best route from
      - how much is it to get to
      - cheapest way across london
      - whats the fastest way to
      - quickest tube journey to
      - how long does it take to get to
      - whats the best way to travel to
    inputs:
      # Both optional on purpose. A missing REQUIRED input is refused inside
      # the runtime before the code runs, and the user is shown a message
      # blaming the app for a perfectly reasonable question. An optional input
      # simply arrives absent, the code notices, and raises something true.
      # NOTE: an optional string arrives as either None or "" — handle both.
      - name: from_station
        type: string
        required: false
        description: >-
          The station the person is starting from, exactly as they wrote it —
          for example "South Kensington", "oxford circus", "kings cross". If
          the message does not name a starting station, return an empty string
          rather than guessing.
      - name: to_station
        type: string
        required: false
        description: >-
          The station they want to reach, exactly as they wrote it. If the
          message names only one station, or none, return an empty string
          rather than guessing which was meant.
      - name: step_free
        type: boolean
        required: false
        description: >-
          Set true only if the person says they need step-free access — a
          lift, no stairs, a wheelchair, a pushchair, crutches. Leave this out
          entirely if they did not mention it. Never infer it and never guess:
          the step-free network is a different network, not a filter, and
          applying it uninvited gives somebody a far slower answer than they
          asked for.
    output:
      - name: step_free
        type: boolean
        required: false
        description: >-
          Present and true only when the answer was worked out on the
          step-free network, so the reply can say so.
      - name: options
        type: array
        description: >-
          Each way of making the journey as one readable line — the lines
          used, journey time, fare in pounds, and "disrupted" where one of
          those lines is. The recommended option leads; the rest follow in
          order of what they cost the person. At most five.
      - name: best
        type: string
        description: >-
          The option that costs the person least overall, repeated as one line
          so it can be read aloud. Ranked on the fare plus the journey time
          valued at the National Living Wage, because ranking on fare alone
          recommends a half-hour walk to save three pounds.
      - name: best_pence
        type: integer
        description: The fare for that option, in whole pence. 0 when it carries no fare.
      - name: cheapest_pence
        type: integer
        description: >-
          The lowest fare among the options that carry one, in whole pence.
          Often the same as best_pence; when it is not, there is a genuine
          trade-off between money and time and both figures are needed to
          describe it. 0 when nothing on offer is priced.
      - name: fastest_minutes
        type: integer
        description: The journey time of the quickest option, in whole minutes.
      - name: disrupted_lines
        type: array
        description: >-
          The lines on this journey reporting anything worse than a good
          service right now. Empty when everything on the route is running.
      - name: peak_tip
        type: string
        required: false
        description: >-
          Present only during a weekday peak, when the same journey is cheaper
          off-peak and off-peak begins within three quarters of an hour. Says
          when peak ends and what waiting would save. Both figures come from
          the same fare table, so the saving is a real price difference rather
          than a comparison across two sources.
      - name: did_you_know
        type: string
        required: false
        description: >-
          One true, surprising thing about the stations on this journey, read
          from the same published interchange list — a designated interchange
          between two stations two metres apart, a gateline inside a station
          that starts a clock when you leave by the wrong door, forty minutes
          allowed one way and twenty coming back. Omitted entirely when there
          is nothing to tell. Never generated or embellished: an invented
          curiosity about somebody's fare would be worse than none.
      - name: fare_warning
        type: string
        required: false
        description: >-
          Present only when the route involves leaving one station and
          entering another that is not a designated out-of-station
          interchange, so the taps are charged as two journeys. Names both
          stations and what the second fare starts at. Omitted entirely when
          there is no such trap, rather than returned empty.

  # ── The same question, asked directly ─────────────────────────────────────
  #
  # Somebody standing at a gateline deciding whether to walk does not want a
  # journey planned; they want one number. Its vocabulary is deliberately
  # disjoint from journey.cost — that one is about getting somewhere
  # ("get", "route", "cheapest", "fastest"), this one is about being charged
  # ("charged", "fare", "pay", "twice", "interchange"). Nothing shared, so
  # they cannot tie.
  #
  # It makes no network call at all: the answer is a lookup in the bundled
  # list plus one fare from the zone table. It is the part of this app that
  # still works when Transport for London is unreachable.
  - id: interchange.check
    summary: >-
      Say whether walking between two named London stations is charged as one
      journey or two, how many minutes are allowed between tapping out and
      tapping in, and what a second fare would cost.
    # "is this an out of station interchange" was dropped. It is the correct
    # term and almost nobody uses it, while it shares three words with
    # "explain out of station interchanges to me" — a request for prose that
    # Pippa answers perfectly well herself. Being picked for that would be
    # worse than missing it, so these carry the action instead of the jargon.
    example_phrases:
      - will i be charged twice
      - is it one fare or two
      - do i pay again if i walk from
      - will i have to tap out and in again
      - does leaving the station cost me another fare
      - can i walk between without paying twice
      - is the walk between them free
    inputs:
      - name: exit_station
        type: string
        required: false
        description: >-
          The station the person is leaving — tapping out of — exactly as they
          wrote it, for example "Oxford Circus", "bond st", "Kings Cross". If
          the message does not name a station being left, return an empty
          string rather than guessing.
      - name: entry_station
        type: string
        required: false
        description: >-
          The station they would then enter — tapping back in. If the message
          names only one station, or none, return an empty string rather than
          guessing which was meant.
    output:
      - name: designated
        type: boolean
        description: >-
          True if Transport for London designate this pair as a single
          journey, so the two taps are charged once.
      - name: minutes_allowed
        type: integer
        description: >-
          Minutes allowed between tapping out and tapping in before the pair
          stops counting as one journey. 0 when it is not designated. Where
          the published list gives different limits for different operators at
          one pair, this is the smallest, so the figure is never more generous
          than the real allowance.
      - name: walk_metres
        type: integer
        description: >-
          How far the walk is. For a designated pair this is Transport for
          London's own published figure, measured entrance to entrance along
          roads — which differs from the gap between the stations more than
          you would expect: Oxford Circus to Bond Street is 280 metres
          published and 551 straight, because both have entrances strung along
          Oxford Street. For an undesignated pair nothing is published, so it
          falls back to a straight line, which understates a real walk. That
          is the safe direction: it never makes a station look further away
          than it is. 0 when unknown.
      - name: journeys_charged
        type: integer
        description: 1 if the pair is designated, 2 if it is not.
      - name: second_fare_pence
        type: integer
        description: >-
          What a second journey starts at, in whole pence — the single fare
          for the entry station's zone. 0 when the pair is designated. A
          floor, not an exact figure: the true extra depends on where the
          whole journey began and ended, which this app is not told.
      - name: exit_station_name
        type: string
        description: The full station name matched to the exit input.
      - name: entry_station_name
        type: string
        description: The full station name matched to the entry input.
      - name: did_you_know
        type: string
        required: false
        description: >-
          One true, surprising thing about these two stations, read from the
          same published list. Omitted when there is nothing to tell.

# ── Deliberately not used ────────────────────────────────────────────────────
#
# No `connectors:` and no `secrets:`. Those ask for a real user's credential
# and registration refuses any app that declares them. DIVERT asks for nobody's
# credential and is told nothing about who is asking — no name, no account, no
# conversation. The optional `app_secrets` entry above is a different thing: a
# key belonging to the app, held by Pippa, never in this repository.
#
# Everything it calls is free and needs no key: Transport for London's line
# status, journey planner and cycle hire availability. The out-of-station
# interchange list is bundled as a 61 KB file beside app.py, because that list
# is not published anywhere any more and there is nothing to call.
#
# On inference: this app calls no language model. Pippa routes, extracts the
# two inputs and writes the reply; the app does three HTTP requests — five
# when cycling is on the table and the hire docks are worth checking, none at
# all for interchange.check — and all of the arithmetic in Python, then
# returns eight short fields. The expensive thing in an assistant is a
# conversation that takes four turns to reach an answer, so the design goal
# here is to need exactly one.
